<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="MES system illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- MES dashboard in the center -->
  <g transform="translate(176 58)">
    <rect width="288" height="170" rx="12" fill="url(#screen)" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="26" rx="12" fill="rgba(255,255,255,0.12)"/>
    <text x="14" y="18" fill="rgba(255,255,255,0.95)" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">MES · Shop-floor control</text>
    <!-- KPI tiles -->
    <g font-family="Inter, Arial, sans-serif" fill="rgba(255,255,255,0.95)">
      <rect x="14" y="42" width="82" height="52" rx="8" fill="rgba(255,255,255,0.12)"/>
      <text x="22" y="62" font-size="10" opacity="0.8">OEE</text>
      <text x="22" y="84" font-size="20" font-weight="700">87%</text>

      <rect x="104" y="42" width="82" height="52" rx="8" fill="rgba(255,255,255,0.12)"/>
      <text x="112" y="62" font-size="10" opacity="0.8">Throughput</text>
      <text x="112" y="84" font-size="20" font-weight="700">142/h</text>

      <rect x="194" y="42" width="82" height="52" rx="8" fill="rgba(255,255,255,0.12)"/>
      <text x="202" y="62" font-size="10" opacity="0.8">Quality</text>
      <text x="202" y="84" font-size="20" font-weight="700">99.3%</text>
    </g>
    <!-- Fake chart -->
    <g stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none">
      <polyline points="14,150 50,138 86,144 122,126 158,132 194,118 230,122 274,108"/>
    </g>
    <g fill="rgba(255,255,255,0.45)">
      <circle cx="14" cy="150" r="2.5"/><circle cx="50" cy="138" r="2.5"/>
      <circle cx="86" cy="144" r="2.5"/><circle cx="122" cy="126" r="2.5"/>
      <circle cx="158" cy="132" r="2.5"/><circle cx="194" cy="118" r="2.5"/>
      <circle cx="230" cy="122" r="2.5"/><circle cx="274" cy="108" r="2.5"/>
    </g>
  </g>

  <!-- Production lines below the dashboard, connected upward -->
  <g fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2">
    <rect x="70" y="252" width="100" height="60" rx="10"/>
    <rect x="190" y="252" width="100" height="60" rx="10"/>
    <rect x="310" y="252" width="100" height="60" rx="10"/>
    <rect x="430" y="252" width="100" height="60" rx="10"/>
    <path d="M120 252 L120 230" stroke-dasharray="4 4"/>
    <path d="M240 252 L240 230" stroke-dasharray="4 4"/>
    <path d="M360 252 L360 230" stroke-dasharray="4 4"/>
    <path d="M480 252 L480 230" stroke-dasharray="4 4"/>
    <path d="M120 230 L480 230" stroke-dasharray="4 4"/>
  </g>
  <g fill="rgba(255,255,255,0.9)" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="120" y="288">Line 1</text>
    <text x="240" y="288">Line 2</text>
    <text x="360" y="288">Line 3</text>
    <text x="480" y="288">Line 4</text>
  </g>

  <text x="40" y="340" fill="rgba(255,255,255,0.9)" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Manufacturing Execution System (MES)</text>
</svg>
